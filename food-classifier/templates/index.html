<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshCheck AI</title>
    <link rel="icon" href="/static/logo.png" type="image/png">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }
        /* Logo Styling */
        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 1rem;
        }
        h1 { color: #2c3e50; font-size: 1.8rem; margin: 0 0 0.5rem 0; }
        p { color: #7f8c8d; margin-bottom: 2rem; }
        
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .btn {
            border: none;
            color: white;
            background-color: #4a90e2;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #357abd; }
        
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        
        #preview-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            display: none;
            margin-top: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        #result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 12px;
            display: none;
            background-color: #f8f9fa;
            border: 1px solid #e1e4e8;
        }
        .label { font-size: 1.4rem; font-weight: bold; margin-bottom: 5px;}
        .sub-text { color: #666; font-size: 0.95rem; }
        
        /* Loading Spinner */
        .loader { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #4a90e2; 
            border-radius: 50%; 
            width: 30px; 
            height: 30px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
            display: none; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <img src="/static/logo.png" alt="App Logo" class="logo">
    
    <h1>FreshCheck AI</h1>
    <p>Upload a fruit or vegetable to analyze quality</p>
    
    <div class="upload-btn-wrapper">
        <button class="btn">Choose Image</button>
        <input type="file" name="file" id="fileInput" accept="image/*">
    </div>

    <div class="loader" id="loader"></div>
    <img id="preview-image" src="#" alt="Image Preview" />
    
    <div id="result-box">
        <div class="label" id="freshness-label"></div>
        <div class="sub-text">Item: <span id="detected-item">--</span></div>
        <div class="sub-text">Confidence: <span id="confidence">--</span></div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const previewImage = document.getElementById('preview-image');
    const resultBox = document.getElementById('result-box');
    const loader = document.getElementById('loader');

    fileInput.onchange = evt => {
        const [file] = fileInput.files;
        if (file) {
            previewImage.src = URL.createObjectURL(file);
            previewImage.style.display = "block";
            resultBox.style.display = "none";
            performPrediction(file);
        }
    };

    async function performPrediction(file) {
        loader.style.display = "block";
        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            document.getElementById('freshness-label').innerText = data.freshness_label;
            document.getElementById('freshness-label').style.color = data.color;
            document.getElementById('detected-item').innerText = data.detected_item;
            document.getElementById('confidence').innerText = data.confidence;
            
            resultBox.style.display = "block";
        } catch (error) {
            console.error("Error:", error);
            alert("Prediction failed.");
        } finally {
            loader.style.display = "none";
        }
    }
</script>

</body>
</html>
